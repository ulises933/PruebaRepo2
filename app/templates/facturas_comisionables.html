<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comisiones de Venta</title>
    <script>
        async function guardarCambios(event) {
            event.preventDefault();
            
            const facturas = [];
            document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                facturas.push({
                    id: checkbox.getAttribute('data-factura-id'),
                    comisionable: checkbox.checked
                });
            });

            try {
                const response = await fetch('/guardar_cambios', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ facturas: facturas })
                });

                if (response.ok) {
                    const result = await response.json();
                    alert('Cambios guardados correctamente');
                } else {
                    alert('Error al guardar los cambios');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al guardar los cambios');
            }
        }
    </script>
</head>
<body>
    <h1>Resumen de Comisiones</h1>
    
    <form id="facturasForm" onsubmit="guardarCambios(event)">
        <h2>Facturas</h2>
        <table>
            <thead>
                <tr>
                    <th>ID de Factura</th>
                    <th>Vendedor</th>
                    <th>Importe</th>
                    <th>Estado</th>
                    <th>Comisionable</th>
                </tr>
            </thead>
            <tbody>
                {% for factura in facturas %}
                <tr>
                    <td>{{ factura.id }}</td>
                    <td>{{ factura.vendedor }}</td>
                    <td>{{ factura.importe }}</td>
                    <td>{{ factura.estado }}</td>
                    <td>
                        <input type="checkbox" 
                               data-factura-id="{{ factura.id }}"
                               {% if factura.comisionable %}checked{% endif %}>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <button type="submit">Guardar Cambios</button>
    </form>

    <form action="/generar_corte" method="post">
        <button type="submit">Generar Corte Mensual</button>
    </form>
</body>
</html>
